{% extends "layout.html" %}

{% block content %}
<div style="max-width: 500px; margin: 20px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px;">
    <h2>Edit Flower Details</h2>
    <form method="POST">
        <div style="margin-bottom: 15px;">
            <label>Flower Name:</label>
            <input type="text" name="name" value="{{ flower.name }}" required style="width: 100%; padding: 8px;">
        </div>
        
        <div style="margin-bottom: 15px;">
           <label>Color:</label>
           <select name="color">
               <option value="Red">Red</option>
               <option value="Orange">Orange</option>
               <option vn value="Green">Green</option>
               <option value="Blue">Blue</option>
               <option value="Indigo">Indigo</option>
               <option value="Violet">Violet</option>
               <option value="White">White</option>
           </select>
        </div>
        
        <div style="margin-bottom: 15px;">
            <label>Price ($):</label>
            <input type="number" step="0.01" name="price" value="{{ flower.price }}" required style="width: 100%; padding: 8px;">
        </div>
        
        <div style="margin-bottom: 15px;">
            <label>Stock Quantity:</label>
            <input type="number" name="stock" value="{{ flower.stock }}" required style="width: 100%; padding: 8px;">
        </div>
        
        <button type="submit" style="width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;">
            Save Changes
        </button>
    </form>
    <p style="text-align: center;"><a href="{{ url_for('catalog_view') }}">Cancel</a></p>
</div>
{% endblock %}
