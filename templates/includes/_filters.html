        <option value="">All Colors</option>
        <option value="Red" {% if request.args.get('color') == 'Red' %}selected{% endif %}>Red</option>
        <option value="Orange" {% if request.args.get('color') == 'Orange' %}selected{% endif %}>Orange</option>
