<!DOCTYPE html>
<html>
<head>
    <title>Flower Shop Catalog</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 20px auto; }
        nav { background: #333; color: white; padding: 15px; display: flex; justify-content: space-between; }
        nav a { color: white; text-decoration: none; }
    </style>
</head>
<body>
    <nav>
        <span><strong>Flower Shop</strong> | Role: {{ role }}</span>
        <a href="{{ url_for('logout') }}" style="color: white;">Exit Shop</a>
    </nav>
    <div style="margin-top:20px;">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
