{% extends "layout.html" %}

{% block content %}
<div style="max-width: 500px; margin: 20px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px;">
    <h2>Edit Flower Details</h2>
    <form method="POST">
        {% if error %}
        <div style="background:#fdecea; color:#c62828; border:1px solid #ef9a9a; border-radius:6px; padding:10px 15px; margin-bottom:14px; font-size:0.9rem;">
            {{ error }}
        </div>
        {% endif %}
        <div style="margin-bottom: 15px;">
            <label>Flower Name:</label>
            <input type="text" name="name" value="{{ flower.name }}" required style="width: 100%; padding: 8px;">
        </div>
        
        <div style="margin-bottom: 15px;">
           <label>Color:</label>
           <select name="color">
               <option value="Red" {% if flower.color == 'Red' %}selected{% endif %}>Red</option>
               <option value="Orange" {% if flower.color == 'Orange' %}selected{% endif %}>Orange</option>
               <option value="Yellow" {% if flower.color == 'Yellow' %}selected{% endif %}>Yellow</option>
               <option value="Green" {% if flower.color == 'Green' %}selected{% endif %}>Green</option>
               <option value="Blue" {% if flower.color == 'Blue' %}selected{% endif %}>Blue</option>
               <option value="Indigo" {% if flower.color == 'Indigo' %}selected{% endif %}>Indigo</option>
               <option value="Violet" {% if flower.color == 'Violet' %}selected{% endif %}>Violet</option>
               <option value="Pink" {% if flower.color == 'Pink' %}selected{% endif %}>Pink</option>
               <option value="White" {% if flower.color == 'White' %}selected{% endif %}>White</option>
           </select>
        </div>
        
        <div style="margin-bottom: 15px;">
            <label>Price ($):</label>
            <input type="number" step="0.01" min="0.01" name="price" value="{{ flower.price }}" required style="width: 100%; padding: 8px;">
        </div>
        
        <div style="margin-bottom: 15px;">
            <label>Stock Quantity:</label>
            <input type="number" min="0" name="stock" value="{{ flower.stock }}" required style="width: 100%; padding: 8px;">
        </div>
        
        <button type="submit" style="width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;">
            Save Changes
        </button>
    </form>
    <p style="text-align: center;"><a href="{{ url_for('catalog_view') }}">Cancel</a></p>
</div>
{% endblock %}
