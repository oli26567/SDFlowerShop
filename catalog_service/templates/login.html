<!DOCTYPE html>
<html>
<head>
    <title>Welcome to Flower Shop</title>
    <style>
        .login-container {
            width: 380px;
            margin: 100px auto;
            padding: 45px;
            background: white;
            border-radius: 35px; /* Matches the big box curvature */
            box-shadow: 0 20px 40px rgba(240, 98, 146, 0.12);
            text-align: center;
            border: 2px solid #fce4ec;
            font-family: 'Segoe UI', sans-serif;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 15px; /* Rounded inputs */
            border: 1px solid #f0f0f0;
            background: #fafafa;
            outline: none;
            box-sizing: border-box;
        }

        input:focus { border-color: #f06292; }

        /* THE FIX: Matching the button to the box style */
        button {
            background: #f06292; /* Peony Pink */
            color: white;
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none; /* Removes the black outline */
            border-radius: 50px; /* Makes it a pill shape */
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(240, 98, 146, 0.2); /* Soft pink shadow */
            transition: 0.3s;
        }

        button:hover {
            background: #ec407a; /* Slightly darker pink on hover */
            transform: translateY(-2px); /* Floats up slightly */
            box-shadow: 0 10px 25px rgba(240, 98, 146, 0.3);
        }

        .btn-visitor {
            display: block;
            margin-top: 25px;
            color: #f06292;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .btn-visitor:hover {
            text-decoration: underline;
        }

        hr {
            border: 0;
            border-top: 1px solid #fce4ec;
            margin: 25px 0;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <form action="/login" method="POST">
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <hr>
        <a href="{{ url_for('visitor_access') }}" style="display:block; margin-top:10px;">
            Continue as Visitor
        </a>
    </div>
</body>
</html>
