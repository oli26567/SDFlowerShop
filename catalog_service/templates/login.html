<!DOCTYPE html>
<html>
<head>
    <title>Welcome to Flower Shop</title>
    <style>
        .login-container {
            width: 350px;
            margin: 100px auto;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            font-family: sans-serif;
        }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        .btn-login { background: #007bff; color: white; border: none; padding: 12px; width: 100%; cursor: pointer; border-radius: 5px; margin-top: 10px; }
        .btn-visitor { display: block; margin-top: 20px; color: #666; text-decoration: none; font-size: 14px; }
        .btn-visitor:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-container">
        <form action="/login" method="POST">
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <hr>
        <a href="{{ url_for('visitor_access') }}" style="display:block; margin-top:10px;">
            Continue as Visitor
        </a>
    </div>
</body>
</html>
